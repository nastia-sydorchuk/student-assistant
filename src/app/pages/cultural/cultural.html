<div class="container mt-5 text-center" *ngIf="isLoading">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container mt-5" *ngIf="errorMessage">
  <div class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>
</div>

<div *ngIf="culturalResources">
  <div class="bg-primary text-white p-4 p-md-5 mb-5 shadow-sm">
    <div class="container">
      <a routerLink="/" class="text-white-50 text-decoration-none d-inline-flex align-items-center mb-4 fw-semibold back-link">
        <span class="material-icons me-2 fs-5">arrow_back</span> Back to Dashboard
      </a>
      <h1 class="display-5 fw-bold mb-2">{{ culturalResources.categoryTitle }}</h1>
      <p class="lead mb-0">{{ culturalResources.description }}</p>
    </div>
  </div>
  
  <main class="container mb-5">
    <div class="row g-4">
      @for (item of culturalResources.items; track item.title) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm border-0 border-top border-warning border-4 hover-lift p-2">
            <div class="card-body d-flex flex-column">
              
              <div class="d-flex align-items-center gap-3 mb-3">
                <span class="material-icons display-6 text-warning">{{ item.icon }}</span>
                <h3 class="h5 fw-bold text-dark mb-0 lh-base">{{ item.title }}</h3>
              </div>
              
              <p class="card-text text-secondary mb-4 flex-grow-1">{{ item.description }}</p>
              
              <a [href]="item.url" target="_blank" rel="noopener noreferrer" class="btn btn-outline-primary fw-bold align-self-start">
                {{ item.actionText }}
              </a>
              
            </div>
          </div>
        </div>
      }
    </div>
  </main>
</div>
