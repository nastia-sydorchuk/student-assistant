name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test

  rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # tests/conftest.py sets a dummy GOOGLE_API_KEY, so no env is needed here
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # environment.ts is gitignored; same fallback as the Dockerfile
      - run: cp src/environments/environment.example.ts src/environments/environment.ts
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose errors out if GOOGLE_API_KEY is unset, even for a build; the value is only used at runtime
      - run: docker compose build
        env:
          GOOGLE_API_KEY: test
