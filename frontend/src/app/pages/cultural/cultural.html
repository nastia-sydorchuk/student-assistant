<app-load-state [isLoading]="isLoading()" [error]="errorMessage()" />

@if (resources(); as res) {
  <app-page-header [title]="res.categoryTitle" [description]="res.description" />

  <main class="container mb-5">
    <div class="row g-4">
      @for (item of res.items; track item.title) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm border-0 border-top border-warning border-4 hover-lift p-2">
            <div class="card-body d-flex flex-column">
              
              <div class="d-flex align-items-center gap-3 mb-3">
                <span class="material-icons display-6 text-warning">{{ item.icon }}</span>
                <h3 class="h5 fw-bold text-dark mb-0 lh-base">{{ item.title }}</h3>
              </div>
              
              <p class="card-text text-secondary mb-4 flex-grow-1">{{ item.description }}</p>
              
              <a [href]="item.url" target="_blank" rel="noopener noreferrer" class="btn btn-outline-primary fw-bold align-self-start">
                {{ item.actionText }}
              </a>
              
            </div>
          </div>
        </div>
      }
    </div>
  </main>
}
