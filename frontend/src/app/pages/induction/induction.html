<app-page-header
  [title]="'INDUCTION.TITLE' | translate"
  [description]="'INDUCTION.SUBTITLE' | translate"
  backLink="/registration"
  backLabel="INDUCTION.BACK_TO_REGISTRATION" />

<main class="container mb-5">
  
  @if (isLoadingEvents()) {
    <div class="mt-5 text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">{{ 'COMMON.LOADING' | translate }}</span>
      </div>
    </div>
  }
  
  @else if (eventsError()) {
    <div class="text-center p-5 bg-danger bg-opacity-10 border border-danger border-opacity-25 rounded text-danger my-5">
      <span class="material-icons display-4 mb-3">error_outline</span>
      <p class="fs-5">{{ eventsError() | translate }}</p>
    </div>
  }

  @else {
    <div class="row g-4">
      @for (event of inductionEvents(); track event.title) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm border-0 border-start border-warning border-4 hover-lift">
            <div class="card-body d-flex flex-column">
              
              <div class="d-flex align-items-start mb-3">
                <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 50px; height: 50px;">
                  <span class="material-icons fs-3">{{ event.icon }}</span>
                </div>
                <h5 class="card-title mb-0 fw-bold text-dark mt-2">{{ event.title }}</h5>
              </div>
              
              <p class="card-text text-secondary mb-4">{{ event.desc }}</p>
              <a [appSmartLink]="event.url"
                    class="text-decoration-none fw-bold mt-auto d-inline-flex align-items-center action-link">
                    {{ event.actionText }} <span class="material-icons ms-1 fs-6 transition-transform">arrow_forward</span>
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  }

</main>
