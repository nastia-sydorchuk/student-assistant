<app-load-state [isLoading]="isLoading()" [error]="errorMessage()" />

@if (resources(); as res) {
  <app-page-header [title]="res.categoryTitle" [description]="res.description" />

  <main class="container mb-5">
    <div class="row g-4">
      @for (service of res.items; track service.title) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm border-0 hover-lift p-3">
            <div class="card-body d-flex flex-column">
              
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 56px; height: 56px;">
                  <span class="material-icons fs-3">{{ service.icon }}</span>
                </div>
                <h3 class="h5 fw-bold text-dark mb-0">{{ service.title }}</h3>
              </div>
              
              <p class="card-text text-secondary flex-grow-1 mb-4">{{ service.description }}</p>
              
              <div class="border-top pt-4 mt-auto">
                <a [href]="'mailto:' + service.contact" class="text-secondary text-decoration-none d-inline-flex align-items-center gap-2 mb-3 w-100 hover-primary">
                  <span class="material-icons fs-5 text-primary">mail</span> {{ service.contact }}
                </a>
                <div class="card-footer bg-transparent border-0 text-center pb-3">
                      <a [appSmartLink]="service.url"
                          class="btn btn-primary w-100 fw-bold mt-auto">
                          {{ service.actionText }}
                      </a>
                  </div>
              </div>
              
            </div>
          </div>
        </div>
      }
    </div>
  </main>
}
